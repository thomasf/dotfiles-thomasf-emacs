public = true

[[ignore]]
match = ["NOTES.org", ".compiled", '.log']

[[script]]
condition = "hostname in ['flam', 'yak']"
src = '''
rev=$(git rev-parse HEAD)
compiled="$(cat .compiled 2>/dev/null || true)"
if ! [[ $rev == $compiled ]]; then
  cd emacs.d
  emacs --no-site-file -batch -l makeup.el  || true
    cd ..
  echo $rev > .compiled
fi
'''
# The emacs theme of the theme in use, which init-ui.el loads (see
# mf-mode-theme).
[[template]]
src = 'emacs.d/themes/dotfiles-theme.el.tmpl'
dst = '.config/theme/emacs.el'
